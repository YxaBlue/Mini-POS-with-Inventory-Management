<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard · MiniPOS</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    
    <link rel="stylesheet" href="dashboard.css">
    <link rel="stylesheet" href="../../../styles/global-styles.css">
    <link rel="stylesheet" href="../../components/navigation/sidebar/sidebar.css">
    <link rel="stylesheet" href="../../components/headers/header/header.css">
    <link rel="stylesheet" href="../../components/modals/modal/modal.css">

    <link rel="stylesheet" href="../../components/output/toast/toast.css">
    <link rel="stylesheet" href="../../components/output/cat-filter/cat-filter.css">
    <link rel="stylesheet" href="../../components/output/stat-card/stat-card.css">
    <link rel="stylesheet" href="../../components/output/widget/widget.css">
    <link rel="stylesheet" href="../../components/output/scrollable-table/scrollable-table.css">
</head>
<body>
    <div class="app-shell">
        <div id="sidebar-mount"></div>

        <div class="app-main">
            <div id="header-mount"></div>

            <main class="page-content">

                <!-- STAT CARDS -->
                <div id="stats-mount"></div>

                <!-- MAIN TWO-COLUMN GRID -->
                <div class="dash-grid">
                    <div id="stock-widget-mount"></div>
                    <div id="recent-widget-mount"></div>
                </div>
            </main>
        </div>
    </div>

    <!-- TRANSACTION DETAILS MODAL -->
    <div id="details-modal" class="modal-overlay">
        <div class="modal card" style="max-width:420px; padding:0;">
            <div id="details-modal-content"></div>
        </div>
    </div>

    <script type="module" src="dashboard.js"></script>
</body>
</html>
