<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory · MiniPOS</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    
    <link rel="stylesheet" href="../../../styles/global-styles.css">
    <link rel="stylesheet" href="inventory.css">
    <link rel="stylesheet" href="../../components/navigation/sidebar/sidebar.css">

    <link rel="stylesheet" href="../../components/headers/header/header.css">
    <link rel="stylesheet" href="../../components/headers/subheader/subheader.css">

    <link rel="stylesheet" href="../../components/output/toast/toast.css">
    <link rel="stylesheet" href="../../components/output/scrollable-table/scrollable-table.css">
    <link rel="stylesheet" href="../../components/output/cat-filter/cat-filter.css">

    <link rel="stylesheet" href="../../components/input/search/search.css">

    <link rel="stylesheet" href="../../components/modals/modal/modal.css">
    <link rel="stylesheet" href="../../components/modals/product-modals/product-modals.css">
</head>

<body>
    <div class="app-shell">
        <div id="sidebar-mount"></div>

        <div class="app-main">
            <!-- PAGE HEADER -->
            <div id="header-mount"></div>
            <div id="subheader-mount"></div>

            <main class="page-content">
                <div class="table-wrapper">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Name</th>
                                <th>Category</th>
                                <th>Description</th>
                                <th>Price</th>
                                <th>Stock</th>
                                <th>Status</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody id="product-tbody"></tbody>
                    </table>
                </div>
            </main>
        </div>
    </div>

    <!-- Add/edit + delete modals are rendered here by product-modals.js -->
    <div id="modals-mount"></div>

    <script type="module" src="inventory.js"></script>
</body>
</html>
