<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Point of Sale · MiniPOS</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
    <link rel="stylesheet" href="../../../styles/global-styles.css">
    <link rel="stylesheet" href="../../components/sidebar/sidebar.css">
    <link rel="stylesheet" href="../../components/toast/toast.css">
    <link rel="stylesheet" href="../../components/modal/modal.css">
    <link rel="stylesheet" href="../../components/product-card/product-card.css">
    <link rel="stylesheet" href="../../components/cart/cart.css">
    <link rel="stylesheet" href="../../components/receipt-modal/receipt-modal.css">
    <link rel="stylesheet" href="../../components/header/header.css">
    <link rel="stylesheet" href="../../components/search/search.css">
    <link rel="stylesheet" href="../../components/subheader/subheader.css">
    <link rel="stylesheet" href="../../components/cat-filter/cat-filter.css">
    <link rel="stylesheet" href="pos.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
</head>
<body>
    <div class="app-shell">
        <div id="sidebar-mount"></div>

        <div class="app-main">
            <!-- PAGE HEADER -->
            <div id="header-mount"></div>
            <div id="subheader-mount"></div>

            <!-- POS body: product grid + cart -->
            <div class="pos-body">

                <!-- Left: product grid -->
                <section class="pos-products">
                    
                    <!-- Product grid mount -->
                    <div id="product-grid-mount" class="pos-grid-wrap"></div>
                </section>

                <!-- Right: cart panel -->
                <aside class="pos-cart">
                    <div id="cart-mount" style="height:100%"></div>
                </aside>

            </div>
        </div>
    </div>

    <!-- Receipt modal -->
    <div id="receipt-modal" class="modal-overlay">
        <div class="modal card" style="max-width:420px; padding:0;">
            <div id="receipt-modal-content"></div>
        </div>
    </div>

    <script type="module" src="pos.js"></script>
</body>
</html>
